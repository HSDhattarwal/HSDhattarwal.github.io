<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0F0F1A"/>
  <!-- Atom: nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="#27AE60"/>
  <!-- Orbit ring 1 (horizontal ellipse) -->
  <ellipse cx="32" cy="32" rx="20" ry="7" stroke="#27AE60" stroke-width="1.8" fill="none" opacity="0.85"/>
  <!-- Orbit ring 2 (rotated 60°) -->
  <ellipse cx="32" cy="32" rx="20" ry="7" stroke="#27AE60" stroke-width="1.8" fill="none" opacity="0.6"
    transform="rotate(60 32 32)"/>
  <!-- Orbit ring 3 (rotated 120°) -->
  <ellipse cx="32" cy="32" rx="20" ry="7" stroke="#27AE60" stroke-width="1.8" fill="none" opacity="0.4"
    transform="rotate(120 32 32)"/>
  <!-- Orbiting electrons -->
  <circle cx="52" cy="32" r="3" fill="#D5F5E3"/>
  <circle cx="22" cy="45.6" r="3" fill="#D5F5E3" opacity="0.75"/>
  <circle cx="22" cy="18.4" r="3" fill="#D5F5E3" opacity="0.5"/>
</svg>
